<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAI Surveillance · KCPH</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#16233A; --muted:#56667C; --bg:#EDF1F5; --paper:#FFFFFF; --line:#D3DCE6;
  --blue:#1F3F8F; --blue-soft:#E6ECF8; --red:#B3122C; --red-soft:#FBE9EC;
  --amber:#8F5A00; --amber-soft:#FFF1D6; --green:#2B7249; --green-soft:#E4F2E9;
  --violet:#5B3E96; --violet-soft:#EFEAF8; --grey:#8A97A8;
  --font:'Atkinson Hyperlegible','Noto Sans Khmer',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:17px/1.5 var(--font);color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums;
  padding-top:env(safe-area-inset-top,0px)}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 .35rem}
h2{font-size:1.2rem;margin:1.6rem 0 .6rem}
h3{font-size:1rem;margin:1.2rem 0 .4rem}
p{margin:.4rem 0}
.lede{color:var(--muted);margin:0 0 1.2rem;max-width:62ch}
a{color:var(--blue)}
:focus-visible{outline:3px solid #7FA2E8;outline-offset:2px}

/* ── login ── */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--paper);border-radius:14px;padding:28px 24px;border:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.brand-mark{width:44px;height:44px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.05rem}
.brand small{display:block;color:var(--muted);font-size:.85rem;line-height:1.3}

/* ── shell ── */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .brand{margin:0}
.top .who{margin-left:auto;text-align:right;font-size:.9rem;line-height:1.3}
.top .who span{display:block;color:var(--muted)}
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100% - 66px)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);
  display:flex;overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1 0 auto;min-width:88px;border:0;background:none;font:inherit;font-size:.82rem;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;position:relative}
nav button[aria-current="page"]{color:var(--blue);font-weight:700;background:var(--blue-soft)}
nav .count{display:inline-block;min-width:1.4em;padding:0 .35em;margin-left:.3em;border-radius:1em;background:var(--red);color:#fff;font-size:.75rem;font-weight:700}
main{padding:20px 16px 110px;max-width:1080px;width:100%}
@media (min-width:900px){
  .shell{grid-template-columns:232px 1fr}
  nav{position:sticky;top:66px;align-self:start;height:calc(100vh - 66px);flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:16px 10px;gap:2px;overflow:auto}
  nav button{flex:0 0 auto;text-align:left;font-size:.95rem;padding:10px 12px}
  main{padding:28px 32px 48px}
}

/* ── forms ── */
form{max-width:720px}
fieldset{border:0;padding:0;margin:0 0 1.2rem}
fieldset > legend{font-weight:700;font-size:1.05rem;padding:0;margin-bottom:.6rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 18px 6px;margin-bottom:16px}
.grid{display:grid;gap:0 16px;grid-template-columns:1fr}
@media (min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.field{display:block;margin:0 0 14px;min-width:0}
.field .lbl,.field > legend{display:block;font-weight:700;font-size:.92rem;margin-bottom:5px}
.field .hint{display:block;color:var(--muted);font-size:.84rem;margin-top:4px}
.field .opt{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:10px 12px;border:1.5px solid #B9C5D3;border-radius:8px;background:#fff;min-height:46px}
textarea{min-height:84px;resize:vertical}
input:disabled{background:var(--bg);color:var(--muted)}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--red);background:var(--red-soft)}
.row{display:flex;gap:8px}
.row > *{flex:1}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice span{display:inline-block;padding:9px 16px;border:1.5px solid #B9C5D3;border-radius:999px;background:#fff;cursor:pointer;min-height:44px;line-height:24px}
.choice input:checked + span{border-color:var(--blue);background:var(--blue);color:#fff}
.choice input:focus-visible + span{outline:3px solid #7FA2E8;outline-offset:2px}
.checks{display:grid;gap:8px;margin:0 0 14px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.check input{width:22px;height:22px;min-height:0;margin:1px 0 0;flex:none;accent-color:var(--blue)}
.check:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
details{margin:0 0 16px;border:1px dashed #B9C5D3;border-radius:10px;padding:10px 14px;background:#fff}
details summary{cursor:pointer;font-weight:700;color:var(--blue)}
details[open] summary{margin-bottom:12px}
.warn{border-left:4px solid var(--amber);background:var(--amber-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:0 0 14px}
.warn ul{margin:.3rem 0 0;padding-left:1.2rem}
.note{color:var(--muted);font-size:.88rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--blue);color:var(--blue);background:#fff;padding:10px 18px;border-radius:8px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.small{padding:6px 12px;min-height:38px;font-size:.9rem}
.btn:disabled{opacity:.55;cursor:progress}
.link{background:none;border:0;color:var(--blue);font:inherit;text-decoration:underline;cursor:pointer;padding:0}

/* ── case list & status track (the signature element) ── */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:flex-end}
.filters .field{margin:0;min-width:150px;flex:1}
.cases{display:grid;gap:10px}
@media (min-width:760px){.cases{grid-template-columns:1fr 1fr}}
.case{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;cursor:pointer}
.case:hover{border-color:#9FB0C6}
.case-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.case-top strong{font-size:1rem}
.case-meta{color:var(--muted);font-size:.9rem;margin:2px 0 10px;display:flex;flex-wrap:wrap;gap:4px 14px}
.chip{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.s-Suspected{background:var(--blue-soft);color:var(--blue)}
.s-Lab-pending{background:var(--amber-soft);color:var(--amber)}
.s-Confirmed,.s-Reclassified{background:var(--green-soft);color:var(--green)}
.s-Rejected{background:var(--red-soft);color:var(--red)}
.s-Committee-reviewed{background:var(--violet-soft);color:var(--violet)}
.s-Closed{background:#E9EDF2;color:#4B5869}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg{height:7px;border-radius:4px;background:#E1E7EE}
.seg.done{background:var(--blue)}
.seg.wait{background:repeating-linear-gradient(90deg,var(--amber) 0 6px,#F3D9A6 6px 10px)}
.seg.skip{background:repeating-linear-gradient(135deg,#E1E7EE 0 4px,#fff 4px 7px)}
.seg.rej{background:var(--red)}
.track-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:.74rem;color:var(--muted);margin-top:4px}
.empty{background:var(--paper);border:1px dashed #B9C5D3;border-radius:10px;padding:22px;color:var(--muted)}

/* ── dialog ── */
dialog{border:0;border-radius:14px;padding:0;width:min(760px,100% - 20px);max-height:calc(100% - 30px);color:var(--ink)}
dialog::backdrop{background:rgba(22,35,58,.45)}
.dlg-head{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);z-index:1}
.dlg-body{padding:16px 18px 8px}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0 0 12px}
dl.facts dt{color:var(--muted);font-size:.9rem}
dl.facts dd{margin:0}
.dlg-section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}

/* ── dashboard ── */
.banner{border-radius:10px;padding:12px 16px;margin-bottom:14px}
.banner.red{background:var(--red-soft);border:1px solid #F0B7C0}
.banner.amber{background:var(--amber-soft);border:1px solid #EACB8E}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-bottom:18px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .v{font-size:1.9rem;font-weight:700;line-height:1.1}
.tile .l{font-size:.86rem;font-weight:700;margin-top:4px}
.tile .d{font-size:.8rem;color:var(--muted)}
.tile.muted .v{color:var(--grey)}
.queues{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.queue{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.queue b{margin-right:4px}
.charts{display:grid;gap:14px}
@media (min-width:900px){.charts{grid-template-columns:1fr 1fr}}
.chart-box{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.chart-box h3{margin:0 0 8px}
.cv{position:relative;height:260px}
.scroll{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:#F5F7FA;font-size:.84rem}
tbody tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;background:#F5F7FA}
.flag{color:var(--red);font-weight:700}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.kv span:nth-child(even){font-weight:700;text-align:right}

/* ── follow-up ── */
.fu{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.bar{height:8px;background:#E1E7EE;border-radius:4px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.bar.due i{background:var(--amber)}
.census-days{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.day{font-size:.8rem;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit}
.day.miss{border-color:#EACB8E;background:var(--amber-soft);color:var(--amber);font-weight:700}

/* ── print documents ── */
.doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px 30px;max-width:900px}
.doc h1{font-size:1.4rem}
.doc h2{font-size:1.05rem;border-bottom:2px solid var(--ink);padding-bottom:3px;margin-top:1.4rem}
.doc table{font-size:.85rem}
.doc th,.doc td{padding:5px 7px;border:1px solid #C8D1DC}
.doc .meta{display:grid;grid-template-columns:max-content 1fr;gap:2px 16px;font-size:.92rem}
.keyfigs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keyfigs div{border:1px solid #C8D1DC;border-radius:6px;padding:8px 10px}
.keyfigs b{display:block;font-size:1.5rem}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
.sign div{border-top:1px solid var(--ink);padding-top:4px;font-size:.85rem;min-height:70px}
.blank-lines div{border-bottom:1px solid #9AA7B6;height:30px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:min(92vw,520px)}
#toast div{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;margin-top:8px;box-shadow:0 6px 18px rgba(22,35,58,.25)}
#toast div.err{background:var(--red)}
@media (min-width:900px){#toast{bottom:24px}}
@media (prefers-reduced-motion:no-preference){ #toast div{animation:pop .18s ease-out} @keyframes pop{from{transform:translateY(8px);opacity:0}} }

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:11pt;padding:0}
  .top,nav,.no-print,#toast{display:none!important}
  .shell{display:block}
  main{padding:0;max-width:none}
  .doc{border:0;padding:0;max-width:none}
  .doc h2{break-after:avoid}
  table{break-inside:auto} tr{break-inside:avoid}
}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="login-card">
    <div class="brand"><div class="brand-mark">HAI</div><div><strong>HAI Surveillance</strong><small>Kampong Chhnang Provincial Hospital</small></div></div>
    <form id="loginForm">
      <label class="field"><span class="lbl">Username</span><input name="username" autocomplete="username" autocapitalize="none" required></label>
      <label class="field"><span class="lbl">PIN</span><input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <p id="loginMsg" class="note" role="alert"></p>
      <button class="btn primary" style="width:100%">Sign in</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><div class="brand-mark">HAI</div><div><strong>HAI Surveillance</strong><small>KCPH</small></div></div>
    <div class="who"><b id="whoName"></b><span id="whoRole"></span></div>
    <button class="btn small" id="menuBtn" aria-label="Account">Account</button>
  </header>
  <div class="shell">
    <nav id="nav" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>
</div>

<dialog id="dlg"><div class="dlg-head"><strong id="dlgTitle"></strong><button class="btn small" id="dlgClose">Close</button></div><div class="dlg-body" id="dlgBody"></div></dialog>
<div id="toast" aria-live="polite"></div>
<datalist id="organisms">
  <option>Escherichia coli</option><option>Klebsiella pneumoniae</option><option>Staphylococcus aureus</option>
  <option>Pseudomonas aeruginosa</option><option>Acinetobacter baumannii</option><option>Enterobacter spp.</option>
  <option>Enterococcus spp.</option><option>Coagulase-negative staphylococci</option><option>Proteus spp.</option>
  <option>Candida spp.</option><option>No growth</option>
</datalist>

<script>
/* ───────── Configuration ───────── */
const API_URL = 'https://script.google.com/macros/s/AKfycbx4XTczkIUasgKMGra06-MFnnjQWjMO6_r7NlwVmoFNiChtDrplal-HMWXlV90P2Xfs/exec';

const ROLE_LABEL = { link_nurse:'IPC link nurse', ot_nurse:'OT link nurse', focal:'IPC focal person', committee:'IPC Committee', management:'Management', admin:'Administrator' };
const NAV_ORDER = {
  link_nurse:['report','census','followup','cases','dashboard'],
  ot_nurse:['ot','followup','dashboard'],
  focal:['cases','report','census','ot','followup','dashboard','reports','alerts'],
  committee:['cases','dashboard','reports','alerts'],
  management:['dashboard','reports','cases'],
  admin:['dashboard','cases','report','census','ot','followup','reports','alerts']
};
const NAV_LABEL = { report:'Report a case', census:'Daily census', ot:'Theatre log', followup:'SSI follow-up', dashboard:'Dashboard', reports:'Reports & exports', alerts:'Alerts',
  cases:{ link_nurse:'My ward cases', focal:'Case queue', committee:'Committee review', management:'Cases', admin:'Case queue' } };
const DEVICE_TYPES = ['CAUTI','CLABSI','PLABSI','VAP'];
const DENOM = { CAUTI:['uc','catheter-days'], CLABSI:['cl','central-line-days'], PLABSI:['piv','peripheral-line-days'], VAP:['vent','ventilator-days'], HAP:['pd','patient-days'] };

const S = { token:null, user:null, meta:null, view:null, charts:[] };
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const main = $('#main');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rate = (n,d,m)=> d>0 ? Math.round(n/d*m*100)/100 : null;
const f = v => (v===null || v===undefined || v==='' || Number.isNaN(v)) ? '—' : v;
const dd = (a,b)=> Math.round((Date.parse(String(b).slice(0,10)) - Date.parse(String(a).slice(0,10)))/864e5);
const cls = s => 's-' + String(s).replace(/\s+/g,'-');
const monthName = m => { const [y,mo]=m.split('-'); return new Date(Date.UTC(+y,+mo-1,1)).toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}); };
const shortMonth = m => { const [y,mo]=m.split('-'); return new Date(Date.UTC(+y,+mo-1,1)).toLocaleDateString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'}); };
const thisMonth = () => (S.meta?.today || new Date().toISOString()).slice(0,7);
function prevMonth(m){ const [y,mo]=m.split('-').map(Number); return mo===1 ? `${y-1}-12` : `${y}-${String(mo-1).padStart(2,'0')}`; }

function store(k,v){ try{ v===null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k,v); }catch(e){} }
function loadStore(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }

function toast(msg, kind){
  const el=document.createElement('div'); if(kind==='err') el.className='err'; el.textContent=msg;
  $('#toast').appendChild(el); setTimeout(()=>el.remove(), kind==='err'?6500:3500);
}

async function api(action, p={}){
  if(API_URL.startsWith('PASTE')) throw new Error('Set API_URL at the top of the script to your Apps Script /exec URL.');
  const url = `${API_URL}?action=${encodeURIComponent(action)}&token=${encodeURIComponent(S.token||'')}&p=${encodeURIComponent(JSON.stringify(p))}`;
  let res;
  try{ res = await fetch(url); }catch(e){ throw new Error('No connection to the server. Check the internet and try again.'); }
  let j; try{ j = await res.json(); }catch(e){ throw new Error('The server sent an unexpected reply. Check the deployment settings.'); }
  if(!j.ok && !j.duplicate){
    if(j.error==='SESSION_EXPIRED'){ signOut('Your session ended. Sign in again.'); throw new Error('Session ended.'); }
    throw new Error(j.error || 'Request failed.');
  }
  return j;
}

async function busy(btn, fn){
  if(!btn){ try{ return await fn(); }catch(e){ toast(e.message,'err'); } return; }
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Working…';
  try{ return await fn(); } catch(e){ toast(e.message,'err'); } finally { btn.disabled=false; btn.textContent=old; }
}

/* ───────── Form helpers ───────── */
const F = (label, ctrl, hint='', optional=false) =>
  `<label class="field"><span class="lbl">${label}${optional?' <span class="opt">(optional)</span>':''}</span>${ctrl}${hint?`<span class="hint">${hint}</span>`:''}</label>`;
const R = (label, name, opts, val='') =>
  `<fieldset class="field"><legend>${label}</legend><div class="choices">${opts.map(o=>`<label class="choice"><input type="radio" name="${name}" value="${esc(o)}" ${o===val?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div></fieldset>`;
const SEL = (name, opts, val='', lab=o=>o, ph='Choose…') =>
  `<select name="${name}"><option value="">${ph}</option>${opts.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(lab(o))}</option>`).join('')}</select>`;
function formData(form){
  const fd = new FormData(form), o = {};
  for(const [k,v] of fd.entries()){ if(k==='criteria'||k==='resistance'){ (o[k]=o[k]||[]).push(v); } else o[k]=typeof v==='string'?v.trim():v; }
  return o;
}
function markMissing(form, names){
  $$('[aria-invalid]',form).forEach(e=>e.removeAttribute('aria-invalid'));
  names.forEach(n=>{ const el=form.querySelector(`[name="${n}"]`); if(el && el.type!=='radio') el.setAttribute('aria-invalid','true'); });
}

/* ───────── Auth & shell ───────── */
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const d = formData(e.target), btn = e.submitter || $('button', e.target);
  $('#loginMsg').textContent='';
  await busy(btn, async()=>{
    try{
      const j = await api('login', d);

function syncCase(form){
  const m=S.meta, d=formData(form), t=d.haiType||'';
  if(form.dataset.type !== t){
    form.dataset.type = t;
    $('#criteriaBox').innerHTML = t ? `<fieldset class="field"><legend>Case definition criteria met</legend>
      <div class="checks">${m.criteria[t].map(c=>`<label class="check"><input type="checkbox" name="criteria" value="${esc(c)}"><span>${esc(c)}</span></label>`).join('')}</div>
      <span class="hint">Tick every criterion you observed.</span></fieldset>` : '';
  }
  $('#deviceBox').hidden = !DEVICE_TYPES.includes(t);
  if(m.deviceFor[t]) $('#deviceLabel').textContent = m.deviceFor[t];
  $('#ssiBox').hidden = t!=='SSI';
  $('#neoBox').hidden = !(t==='Neonatal sepsis' || d.ward==='NICU');
  const w = caseWarnings(d), box=$('#warnBox');
  box.hidden = !w.length;
  box.innerHTML = w.length ? `<b>Check before sending</b><ul>${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '';
}

function caseWarnings(d){
  const w=[];
  if(d.admissionDate && d.onsetDate){
    const day = dd(d.admissionDate, d.onsetDate)+1;
    if(day<1) w.push('Onset date is before the admission date.');
    else if(day<3 && d.haiType!=='SSI') w.push(`Onset is on day ${day} of admission. WHO counts HAI from day 3 of admission; this may be community-acquired.`);
  }
  if(DEVICE_TYPES.includes(d.haiType) && d.deviceInsertDate && d.onsetDate){
    const n = dd(d.deviceInsertDate, d.onsetDate);
    if(n<0) w.push('Device insertion date is after the onset date.');
    else if(n<=2) w.push(`Device was in place ${n} day(s) before onset. Device-associated infection needs more than 2 days.`);
  }
  if(d.haiType==='SSI' && d.surgeryDate && d.onsetDate){
    const n = dd(d.surgeryDate, d.onsetDate), win = d.implant==='Yes'?90:30;
    if(n<0) w.push('Onset date is before the surgery date.');
    else if(n>win) w.push(`Onset is ${n} days after surgery, outside the ${win}-day SSI window.`);
  }
  if(d.hospitalId && !/^PT\d{6}$/.test(d.hospitalId)) w.push('Hospital ID must be PT followed by 6 digits.');
  return w;
}

        <div class="census-days">${days.map(d=>`<button type="button" class="day ${byDate[d]?'':'miss'}" data-d="${d}">${d.slice(5)}</button>`).join('')}</div>

        form.patients.focus();

  };
  if(form.ward.tagName==='SELECT') form.ward.onchange = load;
  load();

    e.preventDefault();
    const d = formData(form);
    const missing = ['date','ward','patients','urinary','central','ventilator'].filter(k=>d[k]==='' || d[k]===undefined);
    markMissing(form, missing);
    if(missing.length){ toast('Enter all required counts. Use 0 when there are none.','err'); return; }
    busy(e.submitter, async()=>{
      const j = await api('submitCensus', d);
      toast(j.updated ? 'Census updated' : 'Census saved');

function trackHTML(c, labels){
  const decided = c.validationDecision;
  const segs = [
    'done',
    c.specimenSent==='No' ? 'skip' : (c.organism ? 'done' : 'wait'),
    decided ? (decided==='Rejected' ? 'rej' : 'done') : '',
    (c.status==='Committee reviewed' || c.status==='Closed') ? 'done' : '',
    c.status==='Closed' ? 'done' : ''
  ];
  return `<div class="track" aria-hidden="true">${segs.map(s=>`<i class="seg ${s}"></i>`).join('')}</div>` +
    (labels ? `<div class="track-labels"><span>Reported</span><span>Lab</span><span>Validated</span><span>Committee</span><span>Closed</span></div>` : '');
}

function openCase(id, reload){
  const c = S.caseCache.find(x=>x.caseId===id), m=S.meta, role=S.user.role;
  const isFocal = role==='focal'||role==='admin', isCommittee = role==='committee'||role==='admin';
  const day = dd(c.admissionDate, c.onsetDate)+1;
  const facts = [
    ['Status', `<span class="chip ${cls(c.status)}">${esc(c.status)}</span>`],
    ['Ward', esc(c.ward)],
    ['Hospital ID', c.hospitalId ? esc(c.hospitalId) : '<span class="note">Not shown for your role</span>'],
    ['Patient', `${esc(c.sex)}, ${esc(c.ageValue)} ${esc(String(c.ageUnit).toLowerCase())}`],
    ['Admission', esc(c.admissionDate)],
    ['Onset', `${esc(c.onsetDate)} (day ${day} of admission)`],
    ['Reported as', esc(c.haiType)],
    ['Criteria', String(c.criteria).split('; ').map(esc).join('<br>')],
    c.deviceType && ['Device', `${esc(c.deviceType)}, inserted ${esc(c.deviceInsertDate)} (${dd(c.deviceInsertDate,c.onsetDate)} days before onset)`],
    c.haiType==='SSI' && ['Surgery', `${esc(c.procedureCategory)}, ${esc(c.surgeryDate)}, ${esc(c.woundClass)}, ${esc(c.ssiDepth)}${c.implant==='Yes'?', implant':''}`],
    (c.birthWeight||c.gestAge) && ['Neonate', `${c.birthWeight?esc(c.birthWeight)+' g':''} ${c.gestAge?esc(c.gestAge)+' weeks':''}`],
    ['Specimen sent', esc(c.specimenSent)],
    c.organism && ['Culture', `${esc(c.organism)}${c.resistance?` <b class="flag">${esc(c.resistance)}</b>`:''} (sent ${esc(c.dateSent)}, result ${esc(c.dateResult)})`],
    c.admissionDx && ['Admission diagnosis', esc(c.admissionDx)],
    c.antibiotics && ['Antibiotics', esc(c.antibiotics)],
    c.prophylaxis && ['Prophylaxis', esc(c.prophylaxis)],
    c.notes && ['Notes', esc(c.notes)],
    ['Reported by', `${esc(c.reporter)}, ${esc(c.createdAt)}`],
    c.validationDecision && ['Validation', `${esc(c.validationDecision)}${c.finalHaiType?' as '+esc(c.finalHaiType):''} by ${esc(c.validatedBy)}, ${esc(c.validatedAt)}${c.reason?'<br>'+esc(c.reason):''}`],
    c.committeeDate && ['Committee', `Reviewed ${esc(c.committeeDate)} by ${esc(c.reviewedBy)}${c.committeeComment?'<br>'+esc(c.committeeComment):''}`],
    c.outcome && ['Outcome', esc(c.outcome)]
  ].filter(Boolean);

  let html = `${trackHTML(c,true)}<dl class="facts" style="margin-top:14px">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;

  if(isFocal && c.status!=='Closed'){
    html += `<form id="labForm" class="dlg-section"><h3>Culture result from Preah Kossamak</h3>
      <div class="grid">
        ${F('Specimen', SEL('specimenType', m.specimens, c.specimenType))}
        ${F('Date sent', `<input type="date" name="dateSent" max="${m.today}" value="${esc(c.dateSent)}">`)}
        ${F('Date result received', `<input type="date" name="dateResult" max="${m.today}" value="${esc(c.dateResult)}">`,'',true)}
        ${F('Organism', `<input name="organism" list="organisms" value="${esc(c.organism)}" placeholder="Type or choose">`,'Choose “No growth” for a negative culture',true)}
      </div>
      <fieldset class="field"><legend>Resistance</legend><div class="choices">${m.resistance.map(r=>`<label class="choice"><input type="checkbox" name="resistance" value="${r}" ${String(c.resistance).split(', ').includes(r)?'checked':''}><span>${r}</span></label>`).join('')}</div>
      <span class="hint">Any tick sends an MDRO alert to the IPC team.</span></fieldset>
      <div class="actions"><button class="btn">Save lab result</button></div></form>`;
  }
  if(isFocal && !['Committee reviewed','Closed'].includes(c.status)){
    html += `<form id="valForm" class="dlg-section"><h3>Validation</h3>
      ${R('Decision','decision',['Confirmed','Rejected','Reclassified'], c.validationDecision)}
      <div id="reclass" ${c.validationDecision==='Reclassified'?'':'hidden'}>${F('Correct HAI type', SEL('finalHaiType', m.haiTypes, c.finalHaiType))}</div>
      ${F('Reason', `<textarea name="reason">${esc(c.reason)}</textarea>`, 'Required when rejecting or reclassifying')}
      ${F('Patient outcome so far', SEL('outcome', m.outcomes, c.outcome), '', true)}
      <div class="actions"><button class="btn primary">Save validation</button></div></form>`;
  }
  if(isCommittee && ['Confirmed','Rejected','Reclassified'].includes(c.status)){
    html += `<form id="revForm" class="dlg-section"><h3>IPC Committee review</h3>
      ${F('Committee comment or action', '<textarea name="comment"></textarea>', '', true)}
      <div class="actions"><button class="btn primary">Mark reviewed by Committee</button></div></form>`;
  }
  if(isFocal && c.status==='Committee reviewed'){
    html += `<form id="closeForm" class="dlg-section"><h3>Close case</h3>
      ${F('Patient outcome', SEL('outcome', m.outcomes.filter(o=>o!=='Still admitted'), c.outcome==='Still admitted'?'':c.outcome))}
      <div class="actions"><button class="btn">Close case</button></div></form>`;
  }
  openDlg(c.caseId, html);

  const after = msg => { toast(msg); closeDlg(); reload(); };
  const lab=$('#labForm'); if(lab) lab.onsubmit=e=>{ e.preventDefault(); busy(e.submitter, async()=>{ await api('updateLab',{caseId:id, ...formData(lab), resistance:formData(lab).resistance||[]}); after('Lab result saved'); }); };
  const val=$('#valForm'); if(val){
    val.onchange=()=>{ $('#reclass').hidden = formData(val).decision!=='Reclassified'; };
    val.onsubmit=e=>{ e.preventDefault(); busy(e.submitter, async()=>{ await api('validateCase',{caseId:id, ...formData(val)}); after('Validation saved'); }); };
  }
  const rev=$('#revForm'); if(rev) rev.onsubmit=e=>{ e.preventDefault(); busy(e.submitter, async()=>{ await api('committeeReview',{caseId:id, ...formData(rev)}); after('Marked reviewed by Committee'); }); };
  const cl=$('#closeForm'); if(cl) cl.onsubmit=e=>{ e.preventDefault(); busy(e.submitter, async()=>{ await api('closeCase',{caseId:id, ...formData(cl)}); after('Case closed'); }); };
}

/* ───────── Rates ───────── */
function ratesRows(s, nicuPd, ssi){
  const c=t=>s.cases[t]||0;
  const rows = [
    ['All HAI', s.total, s.pd, rate(s.total,s.pd,1000), 'per 1,000 patient-days'],
    ['CAUTI', c('CAUTI'), s.uc, rate(c('CAUTI'),s.uc,1000), 'per 1,000 catheter-days'],
    ['CLABSI', c('CLABSI'), s.cl, rate(c('CLABSI'),s.cl,1000), 'per 1,000 central-line-days'],
    ['PLABSI', c('PLABSI'), s.piv, rate(c('PLABSI'),s.piv,1000), 'per 1,000 peripheral-line-days'],
    ['VAP', c('VAP'), s.vent, rate(c('VAP'),s.vent,1000), 'per 1,000 ventilator-days'],
    ['HAP', c('HAP'), s.pd, rate(c('HAP'),s.pd,1000), 'per 1,000 patient-days']
  ];
  if(nicuPd!==null) rows.push(['Neonatal sepsis', c('Neonatal sepsis'), nicuPd, rate(c('Neonatal sepsis'),nicuPd,1000), 'per 1,000 NICU patient-days']);
  if(ssi) rows.push(['SSI', ssi.n, ssi.d, rate(ssi.n,ssi.d,100), 'per 100 procedures']);
  return rows;
}
const scopeSums = (a, scope) => scope ? a.wards[scope] : a.hospital;
const scopeNicu = (a, scope) => (!scope || scope==='NICU') ? a.nicuPd : null;

function renderDashboard(d, scope){
  const cur=d.current, s=scopeSums(cur,scope), hosp=cur.hospital;
  const rows = ratesRows(s, scopeNicu(cur,scope), scope ? null : cur.ssi);
  const hrows = Object.fromEntries(ratesRows(hosp, cur.nicuPd, cur.ssi).map(r=>[r[0],r]));
  const showQueues = ['focal','committee','admin'].includes(S.user.role);
  const rep = d.report;
  let html = '';
  if(d.flags.length) html += `<div class="banner red"><b>Above usual level:</b> ${d.flags.map(f=>`${esc(f.ward)} at ${f.rate} per 1,000 patient-days (usual upper limit ${f.threshold})`).join('; ')}. Review for a possible outbreak.</div>`;
  if(scope && !s.pd && scope!=='Operation Theater') html += `<div class="banner amber">No census entered for ${esc(scope)} in ${monthName(d.month)}, so rates cannot be calculated.</div>`;
  if(showQueues) html += `<div class="queues">
      <span class="queue"><b>${d.queues.validation}</b>waiting for validation</span>
      <span class="queue"><b>${d.queues.labPending}</b>waiting for lab result</span>
      <span class="queue"><b>${d.queues.review}</b>waiting for Committee</span>
      <span class="queue">Report for ${monthName(d.month)}: <b>${esc(rep.status)}</b>, due ${esc(rep.due)}${rep.onTime===false?' <span class="flag">late</span>':''}</span></div>`;

  html += `<h2>${scope?esc(scope):'Whole hospital'}, ${monthName(d.month)}</h2><div class="tiles">${rows.map(r=>{
    const h = scope && hrows[r[0]] ? `<div class="d">Hospital: ${f(hrows[r[0]][3])}</div>` : '';
    return `<div class="tile ${r[3]===null?'muted':''}"><div class="v">${f(r[3])}</div><div class="l">${r[0]}</div><div class="d">${r[1]} cases / ${r[2].toLocaleString()} ${r[4].replace(/per [\d,]+ /,'')}</div>${h}</div>`;
  }).join('')}${scope ? `<div class="tile"><div class="v">${f(hrows.SSI[3])}</div><div class="l">SSI (hospital-wide)</div><div class="d">${hrows.SSI[1]} / ${hrows.SSI[2]} procedures</div></div>` : ''}</div>`;

  html += `<div class="charts">
    <div class="chart-box"><h3>HAI per 1,000 patient-days, 12 months</h3><div class="cv"><canvas id="c1"></canvas></div></div>
    <div class="chart-box"><h3>Device-associated rates, 12 months</h3><div class="cv"><canvas id="c2"></canvas></div></div>
  </div>`;

  if(!scope){
    const W = S.meta.censusWards;
    html += `<h2>By ward</h2><div class="scroll"><table><thead><tr><th>Ward</th><th>Patient-days</th><th>HAIs</th><th>Rate /1,000 PD</th><th>Catheter DUR</th><th>Central line DUR</th><th>Ventilator DUR</th></tr></thead><tbody>
      ${W.map(w=>{ const x=cur.wards[w], fl=d.flags.find(f=>f.ward===w);
        return `<tr><td>${esc(w)}${fl?' <span class="flag">above usual</span>':''}</td><td>${x.pd.toLocaleString()}</td><td>${x.total}</td><td class="${fl?'flag':''}">${f(rate(x.total,x.pd,1000))}</td><td>${f(rate(x.uc,x.pd,1))}</td><td>${f(rate(x.cl,x.pd,1))}</td><td>${f(rate(x.vent,x.pd,1))}</td></tr>`; }).join('')}
      <tr class="total"><td>Hospital</td><td>${hosp.pd.toLocaleString()}</td><td>${hosp.total}</td><td>${f(rate(hosp.total,hosp.pd,1000))}</td><td>${f(rate(hosp.uc,hosp.pd,1))}</td><td>${f(rate(hosp.cl,hosp.pd,1))}</td><td>${f(rate(hosp.vent,hosp.pd,1))}</td></tr>
      </tbody></table></div><p class="note">DUR (device utilisation ratio) = device-days ÷ patient-days. A falling DUR means devices are removed sooner.</p>`;

    html += `<h2>SSI by procedure</h2>${cur.ssi.byCategory.length ? `<div class="scroll"><table><thead><tr><th>Procedure</th><th>Operations</th><th>SSIs</th><th>Rate /100</th></tr></thead><tbody>
      ${cur.ssi.byCategory.map(r=>`<tr><td>${esc(r.key)}</td><td>${r.procedures}</td><td>${r.ssi}</td><td>${f(r.rate)}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">SSIs are counted in the month of surgery, so recent months rise as late infections are found.</p>` : '<p class="empty">No operations logged this month.</p>'}`;

    html += `<div class="charts" style="margin-top:14px">
      <div class="chart-box"><h3>Organisms from positive cultures</h3>${cur.micro.organisms.length?'<div class="cv"><canvas id="c3"></canvas></div>':'<p class="note">No positive culture results this month.</p>'}</div>
      <div><h3 style="margin-top:0">Microbiology and data quality</h3><div class="kv">
        <span>Suspected cases with specimen sent</span><span>${f(cur.micro.sentPct)}% (${cur.micro.sent}/${cur.micro.suspected})</span>
        <span>Positive cultures</span><span>${cur.micro.positive} of ${cur.micro.resulted}</span>
        <span>MDRO among positive cultures</span><span>${f(cur.micro.mdroPct)}%${cur.micro.resistance.length?' ('+cur.micro.resistance.map(r=>esc(r.name)+' '+r.count).join(', ')+')':''}</span>
        <span>Median lab turnaround</span><span>${f(cur.micro.tatMedian)} days</span>
        <span>Deaths among confirmed HAI cases</span><span>${cur.mortality.died} of ${cur.mortality.withOutcome} (${f(cur.mortality.pct)}%)</span>
        <span>Cases validated within 7 days</span><span>${f(cur.timeliness.within7Pct)}% (${cur.timeliness.within7}/${cur.timeliness.validated})</span>
        <span>Census completeness</span><span>${f(cur.timeliness.censusPct)}% (${cur.timeliness.censusRows}/${cur.timeliness.censusExpected} ward-days)</span>
      </div></div></div>`;
  }
  $('#dash').innerHTML = html;
  drawTrend(d, scope);
  if(!scope && cur.micro.organisms.length) drawOrganisms(cur.micro.organisms);
}

function chartOk(){ if(typeof Chart==='undefined'){ $$('.chart-box canvas').forEach(c=>c.replaceWith(Object.assign(document.createElement('p'),{className:'note',textContent:'Charts could not load. Check the internet connection.'}))); return false; } return true; }
function drawTrend(d, scope){
  if(!chartOk()) return;
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = '#56667C';
  const labels = d.trend.map(t=>shortMonth(t.month));
  const sc = t => scope ? t.wards[scope] : t.hospital;
  const ds1 = [{label: scope||'Hospital', data:d.trend.map(t=>rate(sc(t).total, sc(t).pd, 1000)), borderColor:'#1F3F8F', backgroundColor:'#1F3F8F', tension:.25, spanGaps:true}];
  if(scope) ds1.push({label:'Hospital', data:d.trend.map(t=>rate(t.hospital.total,t.hospital.pd,1000)), borderColor:'#8A97A8', backgroundColor:'#8A97A8', borderDash:[5,4], tension:.25, spanGaps:true});
  S.charts.push(new Chart($('#c1'), {type:'line', data:{labels, datasets:ds1}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:!!scope}}, scales:{y:{beginAtZero:true}}}}));
  const col = {CAUTI:'#1F3F8F', CLABSI:'#B3122C', VAP:'#2B7249', PLABSI:'#8F5A00'};
  const ds2 = ['CAUTI','CLABSI','VAP','PLABSI'].map(t=>({label:t, data:d.trend.map(x=>{ const s=sc(x); return rate(s.cases[t]||0, s[DENOM[t][0]], 1000); }), borderColor:col[t], backgroundColor:col[t], tension:.25, spanGaps:true}));
  S.charts.push(new Chart($('#c2'), {type:'line', data:{labels, datasets:ds2}, options:{responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true, title:{display:true,text:'per 1,000 device-days'}}}}}));
}
function drawOrganisms(list){
  if(!chartOk()) return;
  const top = list.slice(0,8);
  S.charts.push(new Chart($('#c3'), {type:'bar', data:{labels:top.map(o=>o.name), datasets:[{data:top.map(o=>o.count), backgroundColor:'#1F3F8F'}]},
    options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, ticks:{precision:0}}}}}));
}

function tbl(head, rows, total){

      ['Resistance found', cur.micro.resistance.map(r=>esc(r.name)+': '+r.count).join(', ')||'None'],
      ['Median turnaround, Preah Kossamak', `${f(cur.micro.tatMedian)} days`]])}
    ${cur.micro.organisms.length ? '<h3>Organisms</h3>'+tbl(['Organism','Isolates'], cur.micro.organisms.map(o=>[esc(o.name),o.count])) : ''}

    <h2>6. Alerts and cluster investigations</h2>
    ${j.alerts.length ? tbl(['Date','Type','Ward','Details'], j.alerts.map(a=>[esc(a.createdAt),esc(a.type),esc(a.ward),`<span style="white-space:normal">${esc(a.message)}</span>`])) : '<p>No alerts this month.</p>'}
    ${d.flags.length ? `<p><b>Wards above usual level:</b> ${d.flags.map(x=>`${esc(x.ward)} (${x.rate}, limit ${x.threshold})`).join('; ')}</p>` : ''}

    <h2>7. Data quality and timeliness</h2>
    ${tbl(['Measure','Value'],[
      ['Census completeness', `${f(cur.timeliness.censusPct)}% (${cur.timeliness.censusRows}/${cur.timeliness.censusExpected} ward-days)`],
      ['Cases validated within 7 days', `${f(cur.timeliness.within7Pct)}% (${cur.timeliness.within7}/${cur.timeliness.validated})`],
      ['Cases waiting for validation (all months)', d.queues.validation],
      ['Cases waiting for Committee review (all months)', d.queues.review],
      ['Deaths among confirmed HAI cases', `${cur.mortality.died} of ${cur.mortality.withOutcome} with known outcome`]])}

    <h2>8. Committee conclusions and action plan</h2>
    <p style="white-space:pre-wrap">${esc(rec.conclusions) || '<span class="note">Not yet written.</span>'}</p>
    ${actions.length ? tbl(['Action','Responsible','Due date'], actions.map(a=>[`<span style="white-space:normal">${esc(a.action)}</span>`,esc(a.owner),esc(a.due)])) : ''}

    <h2>9. Signatures</h2>
    <div class="sign"><div>Prepared by<br>IPC focal person</div><div>Reviewed by<br>Chair, IPC Committee</div><div>Approved by<br>Hospital Director</div></div>
  </article>`;

  const editor = canEdit ? `<div class="panel no-print" style="margin-top:16px"><h2 style="margin-top:0">Committee conclusions and actions</h2>
    <form id="repForm">
      ${F('Conclusions', `<textarea name="conclusions" rows="5">${esc(rec.conclusions)}</textarea>`)}
      <div id="actRows">${(actions.length?actions:[{}]).map(actRow).join('')}</div>
      <div class="actions"><button type="button" class="btn small" id="addAct">Add action</button></div>
      <div class="actions"><button class="btn primary" id="saveRep">Save draft</button>${canApprove?'<button type="button" class="btn" id="apprRep">Approve report</button>':''}</div>
    </form></div>` : '';
  docShell(editor + doc);
  if(canEdit){
    $('#addAct').onclick=()=>$('#actRows').insertAdjacentHTML('beforeend', actRow({}));
    $('#repForm').onsubmit=e=>{ e.preventDefault(); busy(e.submitter, async()=>{
      const acts=$$('.act-row').map(r=>({action:$('[name=a]',r).value.trim(), owner:$('[name=o]',r).value.trim(), due:$('[name=d]',r).value}));
      await api('saveReport',{month:d.month, conclusions:$('#repForm').conclusions.value, actions:acts});
      toast('Draft saved'); renderMonthly(await api('getReport',{month:d.month}));
    }); };
    const ap=$('#apprRep'); if(ap) ap.onclick=()=>busy(ap, async()=>{
      if(!confirm('Approve this report? It cannot be edited after approval.')) return;
      await api('approveReport',{month:d.month}); toast('Report approved'); renderMonthly(await api('getReport',{month:d.month}));
    });
  }
}
function actRow(a){
  return `<div class="grid act-row" style="grid-template-columns:2fr 1fr 1fr">
    ${F('Action',`<input name="a" value="${esc(a.action||'')}">`)}${F('Responsible',`<input name="o" value="${esc(a.owner||'')}">`)}${F('Due date',`<input type="date" name="d" value="${esc(a.due||'')}">`)}</div>`;
}

function renderPack(j){
  const d=j.dashboard;
  docShell(`<article class="doc">
    <h1>IPC Committee meeting pack</h1>
    <div class="meta"><span>Prepared</span><b>${esc(S.meta.today)}</b><span>Reporting month</span><b>${monthName(d.month)}</b></div>
    <h2>Cases waiting for Committee review (${j.pendingReview.length})</h2>
    ${j.pendingReview.length ? tbl(['Case','Ward','Reported','Decision','Final type','Onset','Culture','Reason'],
      j.pendingReview.map(c=>[esc(c.caseId),esc(c.ward),esc(c.haiType),esc(c.decision),esc(c.finalHaiType),esc(c.onsetDate),esc([c.organism,c.resistance].filter(Boolean).join(', ')),`<span style="white-space:normal">${esc(c.reason)}</span>`])) : '<p>No cases waiting.</p>'}
    <h2>Alerts in ${monthName(d.month)}</h2>
    ${j.alerts.length ? tbl(['Date','Type','Ward','Details'], j.alerts.map(a=>[esc(a.createdAt),esc(a.type),esc(a.ward),`<span style="white-space:normal">${esc(a.message)}</span>`])) : '<p>No alerts.</p>'}
    <h2>Headline rates</h2>
    ${tbl(['Infection','Cases','Denominator','Rate','Unit'], ratesRows(d.current.hospital, d.current.nicuPd, d.current.ssi).map(r=>[r[0],r[1],r[2],f(r[3]),r[4]]))}
    <h2>Notes</h2><div class="blank-lines">${'<div></div>'.repeat(8)}</div>
  </article>`);
}

function renderWardSheet(d, ward){
  const cur=d.current, x=cur.wards[ward], h=cur.hospital;
  const nicu = ward==='NICU' ? x.pd : null;
  const wr = ratesRows(x, nicu, null), hr = Object.fromEntries(ratesRows(h, cur.nicuPd, null).map(r=>[r[0],r]));
  const trend = d.trend.map(t=>[shortMonth(t.month), t.wards[ward].pd, t.wards[ward].total, f(rate(t.wards[ward].total,t.wards[ward].pd,1000)), f(rate(t.hospital.total,t.hospital.pd,1000))]);
  docShell(`<article class="doc">
    <h1>${esc(ward)}: HAI feedback, ${monthName(d.month)}</h1>
    <div class="keyfigs"><div><b>${x.total}</b>confirmed HAIs this month</div><div><b>${f(rate(x.total,x.pd,1000))}</b>per 1,000 patient-days (hospital ${f(rate(h.total,h.pd,1000))})</div>
      <div><b>${f(rate(x.uc,x.pd,1))}</b>catheter utilisation (hospital ${f(rate(h.uc,h.pd,1))})</div></div>
    <h2>Rates by infection type</h2>
    ${tbl(['Infection','Ward cases','Ward rate','Hospital rate','Unit'], wr.filter(r=>r[2]>0||r[1]>0).map(r=>[r[0],r[1],f(r[3]),f(hr[r[0]]?.[3]??null),r[4]]))}
    <h2>Last 12 months</h2>
    ${tbl(['Month','Patient-days','HAIs','Ward rate','Hospital rate'], trend)}
    <h2>Actions agreed by the ward</h2><div class="blank-lines">${'<div></div>'.repeat(6)}</div>
    <p class="note" style="margin-top:14px">Prepared by the IPC team from the HAI surveillance system. Contains no patient identifiers.</p>
  </article>`);
}

function download(wb, name){ if(typeof XLSX==='undefined'){ toast('Excel library did not load. Check the internet connection.','err'); return; } XLSX.writeFile(wb, name); }
function xlsxLineList(j){
  if(typeof XLSX==='undefined'){ toast('Excel library did not load.','err'); return; }
  if(!j.rows.length){ toast('No cases with onset in this period.','err'); return; }
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([j.columns, ...j.rows]), 'Cases');
  download(wb, `KCPH_HAI_line_list_${$('#xf').value}_to_${$('#xt').value}${j.internal?'_INTERNAL':''}.xlsx`);
}
function xlsxSummary(j){
  if(typeof XLSX==='undefined'){ toast('Excel library did not load.','err'); return; }
  const a=j.total, T=S.meta.haiTypes, wb=XLSX.utils.book_new(), add=(rows,name)=>XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), name);
  add([[`KCPH HAI surveillance summary, ${j.from} to ${j.to}`],[],['Infection','Cases','Denominator','Rate','Unit'], ...ratesRows(a.hospital, a.nicuPd, a.ssi)], 'Rates');
  add([['Ward','Patient-days','Catheter-days','Central-line-days','Ventilator-days','Peripheral-line-days',...T,'Total HAI','Rate /1,000 PD'],
    ...S.meta.wards.map(w=>{const x=a.wards[w]; return [w,x.pd,x.uc,x.cl,x.vent,x.piv,...T.map(t=>x.cases[t]||0),x.total,rate(x.total,x.pd,1000)];})], 'By ward');
  add([['Month','Patient-days','Catheter-days','Central-line-days','Ventilator-days','HAI','HAI /1,000 PD','CAUTI rate','CLABSI rate','VAP rate','Operations','SSI','SSI /100'],
    ...j.monthly.map(mm=>{const h=mm.hospital; return [mm.month,h.pd,h.uc,h.cl,h.vent,h.total,rate(h.total,h.pd,1000),rate(h.cases.CAUTI||0,h.uc,1000),rate(h.cases.CLABSI||0,h.cl,1000),rate(h.cases.VAP||0,h.vent,1000),mm.ssi.d,mm.ssi.n,rate(mm.ssi.n,mm.ssi.d,100)];})], 'Monthly');
  add([['Procedure','Operations','SSI','Rate /100'], ...a.ssi.byCategory.map(r=>[r.key,r.procedures,r.ssi,r.rate]), [], ['Wound class','Operations','SSI','Rate /100'], ...a.ssi.byWound.map(r=>[r.key,r.procedures,r.ssi,r.rate])], 'SSI');
  add([['Measure','Value'],['Suspected cases',a.micro.suspected],['Specimens sent',a.micro.sent],['Results received',a.micro.resulted],['Positive',a.micro.positive],['MDRO',a.micro.mdro],['MDRO % of positive',a.micro.mdroPct],['Median turnaround (days)',a.micro.tatMedian],[],['Organism','Isolates'],...a.micro.organisms.map(o=>[o.name,o.count]),[],['Resistance','Count'],...a.micro.resistance.map(r=>[r.name,r.count])], 'Microbiology');
  add([['Measure','Value'],['Census completeness %',a.timeliness.censusPct],['Validated within 7 days %',a.timeliness.within7Pct],['Deaths among confirmed HAI',a.mortality.died],['Confirmed HAI with known outcome',a.mortality.withOutcome]], 'Data quality');
  download(wb, `KCPH_HAI_summary_${j.from}_to_${j.to}.xlsx`);
}

/* ───────── Alerts ───────── */
async function viewAlerts(){
  main.innerHTML = `<h1>Alerts</h1><p class="lede">MDRO results, possible clusters and missing census. The same alerts go to the IPC Telegram group.</p><div id="al"><p class="note">Loading…</p></div>`;
  try{
    const j=await api('listAlerts',{});
    $('#al').innerHTML = j.alerts.length ? `<div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Ward</th><th style="text-align:left">Details</th></tr></thead><tbody>
      ${j.alerts.map(a=>`<tr><td>${esc(a.createdAt)}</td><td>${esc(a.type)}</td><td>${esc(a.ward)}</td><td style="text-align:left;white-space:normal;min-width:260px">${esc(a.message)}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="empty">No alerts yet.</p>';
  }catch(e){ $('#al').innerHTML=`<p class="empty">${esc(e.message)}</p>`; }
}

/* ───────── Boot ───────── */
(async function boot(){
  const t = loadStore('hai_token');
  if(!t) return;
  S.token = t;
  try{ const j = await api('me'); S.user=j.user; S.meta=j.meta; start(); }
  catch(e){ signOut(); }
})();
</script>
